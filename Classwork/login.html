<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 100vh;
      color: white;
    }

    /* Gradient Background */
    .page-bg {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #3d22a6, #8e3610);
      z-index: -1;
    }

    .hero {
      margin-left: 50px;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .hero p {
      font-size: 18px;
      opacity: 0.9;
    }

    /* Login Box */
    .login-container {
      background-color: #fff;
      color: #333;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      width: 300px;
      margin-right: 50px;
    }

    .login-container h2 {
      margin-bottom: 20px;
    }

    form input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    form button {
      width: 100%;
      padding: 12px;
      background-color: #a8b912;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    form button:hover {
      background-color: #6a13c0;
    }

    .signup-text {
      margin-top: 20px;
      font-size: 14px;
      text-align: center;
    }

    .signup-text a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }

    .signup-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <!-- Background -->
  <div class="page-bg"></div>

  <!-- Left Hero -->
  <section class="hero">
    <h1>Welcome Back!</h1>
    <p>Access and manage your task efficiently</p>
  </section>

  <!-- Login Card -->
  <div class="login-container">
    <h2>Login Your ID</h2>
    <form>
      <input type="email" placeholder="Email" required />
      <input type="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    <p class="signup-text">
      Don't have an account? <a href="#">Sign Up</a>
    </p>
  </div>
</body>
</html>
